<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Docs · PDF Studio</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: #0f172a; color: #fff; }
  .topbar a { color: #a5b4fc; text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid #334155; padding: 7px 12px; border-radius: 9px; }
  .topbar a:hover { border-color: #6366f1; }
  .topbar .brand { font-weight: 800; font-size: 15px; }
  .topbar .spacer { flex: 1; }
  .topbar .note { font-size: 12px; color: #94a3b8; }
  #swagger { max-width: 1000px; margin: 0 auto; }
  .swagger-ui .topbar { display: none; }
  .swagger-ui .info { margin: 24px 0; }
  .tt { background:transparent; border:1px solid #334155; color:#a5b4fc; border-radius:9px; cursor:pointer; padding:6px 9px; display:inline-flex; }
  .tt:hover { border-color:#6366f1; }
  .tt svg { width:16px; height:16px; }
  /* Dark mode: soft-invert the Swagger area (topbar is already dark) */
  :root[data-theme="dark"] body { background:#0e131b; }
  :root[data-theme="dark"] #swagger { filter: invert(0.92) hue-rotate(180deg); background:#0e131b; }
  :root[data-theme="dark"] #swagger img, :root[data-theme="dark"] #swagger svg { filter: invert(1) hue-rotate(180deg); }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/api">← Back to app</a>
    <span class="brand">PDF Studio · API Docs</span>
    <span class="spacer"></span>
    <span class="note">Click "Authorize" and paste your API key to try requests.</span>
    <button class="tt" id="themeToggle" title="Toggle light / dark theme"></button>
  </div>
  <div id="swagger"></div>
  <script>
    (function(){
      var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var btn=document.getElementById("themeToggle");
      function apply(t){var d=t==="dark";if(d)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");if(btn)btn.innerHTML=d?SUN:MOON;try{localStorage.setItem("theme",d?"dark":"light");}catch(e){}}
      var t="light";try{t=localStorage.getItem("theme")==="dark"?"dark":"light";}catch(e){}
      apply(t);
      if(btn)btn.onclick=function(){apply(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");};
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    fetch("/api/auth/status").then((r) => r.json()).then((s) => { if (!s.authenticated) location.href = "/"; }).catch(() => {});
    window.ui = SwaggerUIBundle({
      url: "/openapi.json",
      dom_id: "#swagger",
      deepLinking: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
    });
  </script>
</body>
</html>
