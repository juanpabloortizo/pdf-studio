services:
  pdf-studio:
    build: .
    restart: unless-stopped        # always-on: survives crashes and VM reboots
    environment:
      # Set API_KEY in a .env file next to this compose (do NOT commit it to git)
      API_KEY: ${API_KEY}
    volumes:
      # Templates and data (history, PDFs, API key, SQLite DB) persist across deploys
      - ./templates:/app/templates
      - ./data:/app/data
    expose:
      - "8088"          # only reachable by Caddy, NOT exposed to the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - pdf-studio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
